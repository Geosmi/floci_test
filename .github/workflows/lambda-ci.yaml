name: Lambda CI

on:
  workflow_dispatch:

jobs:
  Lambda-CI:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: >-
          --privileged
          --health-cmd "curl -f http://localhost:4566/_floci/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create state infrastructure
        run: |
          aws s3 mb s3://terraform-state --endpoint-url http://localhost:4566
          aws dynamodb create-table \
            --table-name terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://localhost:4566
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Terraform Plan
        run: terraform plan
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Upload file to S3
        working-directory: .
        run: |
          aws s3 cp ./input.txt s3://test-bucket/input.txt \
            --endpoint-url http://localhost:4566
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
      
      - name: Verify upload
        working-directory: .
        run: |
          aws s3 ls s3://test-bucket/ \
            --endpoint-url http://localhost:4566
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Check Floci container logs
        run: docker logs $(docker ps -q --filter ancestor=floci/floci:latest)

      - name: Get Lambda logs
        working-directory: .
        run: |
          sleep 15

          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name /aws/lambda/test-lambda \
            --endpoint-url http://localhost:4566 \
            --order-by LastEventTime \
            --descending \
            --query 'logStreams[0].logStreamName' \
            --output text)

          echo "Log stream: $LOG_STREAM"

          # Get the actual log events
          aws logs get-log-events \
            --log-group-name /aws/lambda/test-lambda \
            --log-stream-name "$LOG_STREAM" \
            --endpoint-url http://localhost:4566 \
            --query 'events[*].message' \
            --output text
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1